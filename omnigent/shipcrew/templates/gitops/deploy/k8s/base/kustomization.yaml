# Installed by shipcrew (omnigent/shipcrew/gitops_install.py). ArgoCD deploys it:
# overlays/main is the production preview, PR previews are generated cluster-side
# by an ApplicationSet from this base. The app must listen on $PORT (3000).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
