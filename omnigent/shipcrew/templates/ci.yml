# Installed by shipcrew. Job name `ci` is the required status check on main: keep it.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # A new push to the same PR cancels its running CI (no wasted minutes).
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    # Self-hosted runner later: set the repo variable SHIPCREW_RUNNER (e.g. "self-hosted").
    runs-on: ${{ vars.SHIPCREW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CI: "1"
      CHROMIUM_PATH: /usr/bin/google-chrome  # preinstalled on GitHub runners: no Playwright download
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # pnpm when the repo has pnpm-lock.yaml (version from package.json "packageManager"), else npm.
      - id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile --prefer-offline" >> "$GITHUB_OUTPUT"
            echo "audit=pnpm audit --prod --audit-level high" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci --prefer-offline --no-audit --no-fund" >> "$GITHUB_OUTPUT"
            echo "audit=npm audit --omit=dev --audit-level=high" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: "${{ steps.pm.outputs.name }}" }
      - run: ${{ steps.pm.outputs.install }}
      # Next.js build cache: incremental builds across runs of the same lockfile.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json') }}-
      # lint, typecheck and unit tests are independent: run them at the same time,
      # then print each log in its own group; the step fails if any of them failed.
      - name: lint + typecheck + test (parallel)
        env: { PM: "${{ steps.pm.outputs.name }}" }
        run: |
          d="${RUNNER_TEMP:-/tmp}/ci"; mkdir -p "$d"
          for s in lint typecheck test; do
            ( $PM run --if-present "$s" > "$d/$s.log" 2>&1; echo $? > "$d/$s.rc" ) &
          done
          wait
          status=0
          for s in lint typecheck test; do
            rc="$(cat "$d/$s.rc")"
            echo "::group::$s (exit $rc)"; cat "$d/$s.log"; echo "::endgroup::"
            [ "$rc" = 0 ] || { echo "::error::$s failed"; status=1; }
          done
          exit $status
      - run: ${{ steps.pm.outputs.name }} run build
      - run: ${{ steps.pm.outputs.audit }}
      - name: e2e (production build)
        run: if [ -f playwright.config.ts ]; then npx playwright test; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  codeql:
    # Code scanning is free on public repos only; private repos need GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
