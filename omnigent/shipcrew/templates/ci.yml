# Installed by shipcrew on main before the first task branch (omnigent/shipcrew/ci_install.py).
# Job name `ci` is the required status check on main: keep it. Agents do not edit
# this file (a change needs human approval); they make package.json scripts match it:
# lint, typecheck, test, build, e2e. Each one runs only when the script exists.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # A new push to the same PR cancels its running CI (no wasted minutes).
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    # Self-hosted runner later: set the repo variable SHIPCREW_RUNNER (e.g. "self-hosted").
    runs-on: ${{ vars.SHIPCREW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CI: "1"
      # Google Chrome is preinstalled on ubuntu-latest: Playwright uses it
      # (launchOptions.executablePath = process.env.CHROMIUM_PATH), never `playwright install`.
      CHROMIUM_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      # Package manager from the lockfile: pnpm-lock.yaml -> pnpm, yarn.lock -> yarn,
      # else npm. No package.json yet (before the Foundation task): nothing to run.
      - id: pm
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ ! -f package.json ]; then out name ""; exit 0; fi
          if [ -f pnpm-lock.yaml ]; then
            out name pnpm; out cache pnpm
            out install "pnpm install --frozen-lockfile --prefer-offline"
            out audit "pnpm audit --prod --audit-level high"
            # pnpm version: package.json "packageManager" when set, else pnpm 10.
            grep -q '"packageManager": *"pnpm@' package.json && out pnpm "" || out pnpm 10
          elif [ -f yarn.lock ]; then
            out name yarn; out cache yarn
            out install "yarn install --frozen-lockfile"
            out audit "true"
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            out name npm; out cache npm
            out install "npm ci --prefer-offline --no-audit --no-fund"
            out audit "npm audit --omit=dev --audit-level=high"
          else
            out name npm; out cache ""
            out install "npm install --no-audit --no-fund"
            out audit "true"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.name == 'pnpm'
        with: { version: "${{ steps.pm.outputs.pnpm }}" }
      - uses: actions/setup-node@v4
        if: steps.pm.outputs.name != ''
        with: { node-version: 22, cache: "${{ steps.pm.outputs.cache }}" }
      - if: steps.pm.outputs.name == 'yarn'
        run: corepack enable
      - if: steps.pm.outputs.name != ''
        run: ${{ steps.pm.outputs.install }}
      # Next.js build cache: incremental builds across runs of the same lockfile.
      - uses: actions/cache@v4
        if: steps.pm.outputs.name != ''
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'yarn.lock') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'yarn.lock') }}-
      # lint, typecheck and unit tests are independent: run them at the same time,
      # then print each log in its own group; the step fails if any of them failed.
      # A script that package.json does not define is skipped (the --if-present rule).
      - name: lint + typecheck + test (parallel)
        if: steps.pm.outputs.name != ''
        env: { PM: "${{ steps.pm.outputs.name }}" }
        run: |
          has() { node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$1"; }
          d="${RUNNER_TEMP:-/tmp}/ci"; mkdir -p "$d"
          for s in lint typecheck test; do
            if has "$s"; then
              ( "$PM" run "$s" > "$d/$s.log" 2>&1; echo $? > "$d/$s.rc" ) &
            else
              echo "no \"$s\" script: skipped" > "$d/$s.log"; echo 0 > "$d/$s.rc"
            fi
          done
          wait
          status=0
          for s in lint typecheck test; do
            rc="$(cat "$d/$s.rc")"
            echo "::group::$s (exit $rc)"; cat "$d/$s.log"; echo "::endgroup::"
            [ "$rc" = 0 ] || { echo "::error::$s failed"; status=1; }
          done
          exit $status
      - name: build
        if: steps.pm.outputs.name != ''
        env: { PM: "${{ steps.pm.outputs.name }}" }
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then "$PM" run build; else echo "no build script: skipped"; fi
          # Weight report: the JS every page loads first (Next.js), in the job summary.
          [ -f .next/build-manifest.json ] && node -e '
            const fs = require("fs"), zlib = require("zlib"), path = require("path");
            const m = JSON.parse(fs.readFileSync(".next/build-manifest.json", "utf8"));
            const files = [...new Set([...(m.rootMainFiles || []), ...((m.pages || {})["/_app"] || [])])];
            let raw = 0, gz = 0;
            for (const f of files) { const b = fs.readFileSync(path.join(".next", f)); raw += b.length; gz += zlib.gzipSync(b).length; }
            console.log(`### Weight\n\n| | size |\n|---|---|\n| First-load JS shared by all routes | ${(gz / 1024).toFixed(1)} kB gzip (${(raw / 1024).toFixed(1)} kB raw, ${files.length} files) |`);
          ' >> "$GITHUB_STEP_SUMMARY" || true
      - if: steps.pm.outputs.name != ''
        run: ${{ steps.pm.outputs.audit }}
      - name: e2e (production build, preinstalled Chrome)
        if: steps.pm.outputs.name != ''
        env: { PM: "${{ steps.pm.outputs.name }}" }
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.e2e ? 0 : 1)'; then "$PM" run e2e; else echo "no e2e script: skipped"; fi
      # The production image the docker deploy target builds after the merge: a
      # broken Dockerfile fails here, not on the live server. Size budget
      # (repo variable SHIPCREW_IMAGE_BUDGET_MB, default 200 MB) only WARNS by
      # default: a red check would spend the task's CI-fix attempts and block the
      # card on a human for a weight regression; set SHIPCREW_IMAGE_BUDGET_ENFORCE=1
      # to fail instead.
      - name: docker build + image size budget
        if: hashFiles('Dockerfile') != ''
        env:
          BUDGET_MB: ${{ vars.SHIPCREW_IMAGE_BUDGET_MB || '200' }}
          ENFORCE: ${{ vars.SHIPCREW_IMAGE_BUDGET_ENFORCE || '0' }}
        run: |
          docker build --quiet --tag shipcrew-ci:latest .
          mb=$(( $(docker image inspect --format '{{.Size}}' shipcrew-ci:latest) / 1000000 ))
          printf '\n**Production image:** %s MB (budget %s MB)\n' "$mb" "$BUDGET_MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt "$BUDGET_MB" ]; then
            msg="the production image is ${mb} MB, over the ${BUDGET_MB} MB budget (Dockerfile: standalone output, no dev dependencies)"
            if [ "$ENFORCE" = 1 ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7, if-no-files-found: ignore }

  codeql:
    # Code scanning is free on public repos only; private repos need GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
