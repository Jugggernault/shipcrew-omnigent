# Installed by shipcrew. AI review on human PRs (agent PRs are already reviewed by the crew).
# Needs the secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).
name: review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  review:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'agent') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, issues: write, id-token: write }
    steps:
      - id: token
        run: echo "present=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with: { fetch-depth: 0 }
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request against .shipcrew/prd.md, DESIGN.md and the linked issue's acceptance
            criteria: correctness, broken shared contracts, security, design-token violations. Post inline
            comments for real defects only, then a summary comment ending with APPROVE or CHANGES.
